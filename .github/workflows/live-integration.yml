name: Live neuro-symbolic integration
on:
  push:
    branches: ["feat/neurosymbolic-agent-v2"]
  workflow_dispatch:
jobs:
  model-and-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RUN_LIVE_INTEGRATION: "1"
      RUN_REDIS_INTEGRATION: "1"
      REDIS_URL: redis://127.0.0.1:6379/15
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-integration.txt
      - name: Install model and redis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-integration.txt
      - name: Run real model, MeTTa, FAISS and Redis integration suite
        run: python -m unittest discover -s tests -p 'test_live_integration.py' -v

  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      RUN_LIVE_INTEGRATION: "1"
      RUN_GEMINI_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gemini adapter
        if: env.GEMINI_API_KEY != ''
        run: python -m pip install langchain-google-genai
      - name: Call real Gemini model when secret exists
        if: env.GEMINI_API_KEY != ''
        run: python -m unittest tests/test_live_integration.py -v
      - name: Explain missing secret
        if: env.GEMINI_API_KEY == ''
        run: echo "NOT TESTED - repository secret GEMINI_API_KEY is unavailable"
